name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  unit-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...

  vulnerability-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...

  integration-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run privileged netlink integration tests
        run: sudo env "PATH=${PATH}" go test -count=1 -tags=integration ./test/integration/...

  deployment-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: deploy/scripts
      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm -v "${PWD}:/work" ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary
          /work/deploy/rbac/rbac.yaml
          /work/deploy/static-pod/image.yaml
          /work/deploy/static-pod/host-binary.yaml

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath ./cmd/route-controller
