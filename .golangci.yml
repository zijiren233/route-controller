version: "2"

run:
  go: "1.27"
  relative-path-mode: gomod
  modules-download-mode: readonly
  build-tags:
    - integration

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - loggercheck
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - sloglint
    - spancheck
    - staticcheck
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    copyloopvar:
      check-alias: true
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
      analyze-types: true
    gocyclo:
      min-complexity: 30
    gosec:
      excludes:
        - G404
    modernize:
      disable:
        - embedlit
        - forvar
        - omitzero
    perfsprint:
      concat-loop: false
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - [{ skipPackageNameChecks: true }]
    testpackage:
      allow-packages:
        - cli
        - config
        - controller
        - planner
        - probe
        - route
    usestdlibvars:
      time-date-month: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    usetesting:
      os-temp-dir: true
    wsl_v5:
      allow-whole-block: true
      branch-max-lines: 4

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gofumpt:
      extra:
        group-params: true
        balance-calls: true
